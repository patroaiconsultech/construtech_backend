name: construtech-agent-preview-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest==8.4.2
      - run: python -m compileall -q app.py config.py prompt.py provider.py quota.py
      - run: PYTHONPATH=. pytest -q
